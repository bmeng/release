ref:
  as: rosa-cluster-lease-health
  from: rosa-aws-cli
  grace_period: 5m
  commands: rosa-cluster-lease-health-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  timeout: 30m0s
  credentials:
  - namespace: test-credentials
    bundle: rosa-cluster-lease-manager
    mount_path: /etc/rosa-cluster-lease-manager
  env:
  - name: LEASE_NAMESPACE
    default: "rosa-cluster-lease"
    documentation: Namespace on the lease host cluster where lease ConfigMaps live.
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: OCM environment for cluster health checks.
  documentation: |-
    Periodic cluster health check for the ROSA lease inventory.

    For each unclaimed cluster, checks OCM status, dedicated-admin RBAC, and
    in-cluster ClusterPackage health. It performs limited PKO CRD ownership
    repair and publishes health-status, health-reason, and health-checked-at
    annotations on the lease ConfigMap. It does not change lease status or
    recover stale claims; rosa-cluster-lease-controller owns those transitions.

    After confirming OCM reports the cluster as ready, fetches a
    cluster-admin kubeconfig via the OCM credentials API and inspects
    hive.openshift.io/managed=true ClusterPackages for missing or
    degraded entries. The expected set is configurable via the
    rosa-cluster-lease-config ConfigMap (keys: expected-clusterpackages
    or expected-clusterpackages-<cluster-type>), defaulting to the eight
    standard managed operators. Active, provisioning, and maintenance clusters
    are skipped so repairs never interfere with lifecycle operations or tests.

    Run as a periodic Prow job (e.g. every 30 minutes).
